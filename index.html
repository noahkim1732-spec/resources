partment of Education","type":"Costs & Aid Offers","href":"https://collegecost.ed.gov/net-price","time":"Open resource"},{"title":"Understand Student Loans","description":"Review loan types, interest, and borrowing limits.","source":"Federal Student Aid","type":"Loans & Budgeting","href":"https://studentaid.gov/understand-aid/types/loans","time":"Open resource"},{"title":"Loan Simulator","description":"Estimate payments and compare repayment plans.","source":"Federal Student Aid","type":"Loans & Budgeting","href":"https://studentaid.gov/loan-simulator/","time":"Open resource"},{"title":"Manage College Money","description":"Budget refunds, accounts, fees, and expenses.","source":"CFPB","type":"Loans & Budgeting","href":"https://www.consumerfinance.gov/consumer-tools/student-loans/manage-your-college-money/","time":"Open resource"}]},{"id":"academic-success","number":"02","eyebrow":"Doing well in class","title":"Academic Success","short":"Academics","intro":"Use proven study strategies, plan your time, improve your writing, and know when to ask for help.","color":"green","resources":[{"title":"Academic Planning Worksheets","description":"Use semester, weekly, and goal-setting worksheets.","source":"UNC Learning Center","type":"Planning & Time Management","href":"https://learningcenter.unc.edu/tips-and-tools/coaching-tools/","time":"Open resource"},{"title":"Beat Procrastination","description":"Identify delay patterns and start difficult work.","source":"UNC Learning Center","type":"Planning & Time Management","href":"https://learningcenter.unc.edu/tips-and-tools/procrastination/","time":"Open resource"},{"title":"Academic Success Guide","description":"Build practical habits for college-level courses.","source":"UNC Learning Center","type":"Planning & Time Management","href":"https://learningcenter.unc.edu/tips-and-tools/how-to-succeed/","time":"Open resource"},{"title":"The Study Cycle","description":"Use preview, review, focused study, and self-testing.","source":"UN ding College","href":"https://www.firstgenforward.org/","time":"Open resource"},{"title":"College Vocabulary","description":"Decode financial-aid and enrollment terminology.","source":"Federal Student Aid","type":"Understanding College","href":"https://studentaid.gov/help-center/answers/topic/glossary/articles","time":"Open resource"},{"title":"The Hidden Curriculum","description":"Learn unwritten academic expectations.","source":"Notre Dame Learning","type":"Understanding College","href":"https://learning.nd.edu/news/uplifting-first-generation-undergraduates-practical-strategies-in-small-classes-and-large-lectures/","time":"Open resource"},{"title":"TRIO Student Support","description":"Explore tutoring, advising, and mentoring programs.","source":"U.S. Department of Education","type":"Programs & Mentors","href":"https://www.ed.gov/grants-and-programs/grants-higher-education/trio/student-support-services-program","time":"Open resource"},{"title":"Campus First-Gen Programs","description":"Find first-gen centers, mentors, and events.","source":"Your college","type":"Programs & Mentors","href":"https://www.google.com/search?q=site%3A.edu+first-generation+student+program","time":"Open resource"},{"title":"First-Gen Celebration","description":"Connect with national first-gen celebrations.","source":"FirstGen Forward","type":"Programs & Mentors","href":"https://firstgen.naspa.org/engagement/first-generation-college-celebration","time":"Open resource"},{"title":"Prepare for Office Hours","description":"Make professor conversations useful.","source":"Notre Dame Learning","type":"Academic Confidence","href":"https://learning.nd.edu/news/uplifting-first-generation-undergraduates-practical-strategies-in-small-classes-and-large-lectures/","time":"Open resource"},{"title":"Find Academic Support","description":"Locate advising, tutoring, and writing support.","source":"Your college","type":"Academic Confidence","href":"https://www.google.com/search?q=site%3A.edu+academic+support+ ource":"CareerOneStop","type":"Experience & Internships","href":"https://www.careeronestop.org/FindTraining/Types/internships.aspx","time":"Open resource"},{"title":"Find Apprenticeships","description":"Search paid work-and-training opportunities.","source":"Apprenticeship.gov","type":"Experience & Internships","href":"https://www.apprenticeship.gov/apprenticeship-job-finder","time":"Open resource"},{"title":"Skills Matcher","description":"Identify transferable skills from your experiences.","source":"CareerOneStop","type":"Experience & Internships","href":"https://www.careeronestop.org/Toolkit/Skills/skills-matcher.aspx","time":"Open resource"},{"title":"Build Your Résumé","description":"Describe projects, work, coursework, and service.","source":"CareerOneStop","type":"Applications","href":"https://www.careeronestop.org/JobSearch/Resumes/resumes.aspx","time":"Open resource"},{"title":"Résumé Examples","description":"Review formatting, action verbs, and examples.","source":"Purdue OWL","type":"Applications","href":"https://owl.purdue.edu/owl/job_search_writing/resumes_and_vitas/index.html","time":"Open resource"},{"title":"Write a Cover Letter","description":"Connect your experience to a specific role.","source":"Purdue OWL","type":"Applications","href":"https://owl.purdue.edu/owl/job_search_writing/job_search_letters/cover_letters_1_quick_tips/index.html","time":"Open resource"},{"title":"Prepare for Interviews","description":"Practice answers and research employers.","source":"CareerOneStop","type":"Interviews & Networking","href":"https://www.careeronestop.org/JobSearch/Interview/interview-and-negotiate.aspx","time":"Open resource"},{"title":"Learn to Network","description":"Build genuine professional relationships.","source":"CareerOneStop","type":"Interviews & Networking","href":"https://www.careeronestop.org/JobSearch/Network/network.aspx","time":"Open resource"},{"title":"Career-Ready Skills","description":"Review the competencies employers value.","source": e}</span></div><h3>${r.title}</h3><p>${r.description}</p><div class="card-footer"><span>${r.source}</span><b aria-hidden="true">↗</b></div></a>`).join("")}</div>`;buttons.forEach(b=>b.setAttribute("aria-selected",String(b.dataset.id===c.id)));history.replaceState(null,"","#"+c.id)}buttons.forEach(b=>b.addEventListener("click",()=>show(b.dataset.id)));document.querySelector("#back-link").addEventListener("click",e=>{e.preventDefault();show("financial-aid");scrollTo({top:0,behavior:"smooth"})});show(location.hash.slice(1));</script></body></html>
