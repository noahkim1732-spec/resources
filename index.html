<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Trusted resources and real student perspectives for college."><title>College Student Resources</title><link rel="stylesheet" href="styles.css"></head><body><main><header class="page-intro"><p class="kicker">College student guide</p><div class="intro-row"><div><h1>Resources</h1><p>Trusted tools, practical guidance, and real student perspectives for every stage of college.</p></div><div class="resource-count"><strong>36</strong><span>curated resources</span></div></div></header><nav class="tab-bar" aria-label="Resource categories"><div role="tablist"><button role="tab" aria-selected="true" aria-controls="resource-panel" data-id="financial-aid"><span>01</span>Financial Aid</button><button role="tab" aria-selected="false" aria-controls="resource-panel" data-id="academic-success"><span>02</span>Academics</button><button role="tab" aria-selected="false" aria-controls="resource-panel" data-id="campus-life"><span>03</span>Campus Life</button><button role="tab" aria-selected="false" aria-controls="resource-panel" data-id="first-generation"><span>04</span>First-Gen</button><button role="tab" aria-selected="false" aria-controls="resource-panel" data-id="career-preparation"><span>05</span>Careers</button><button role="tab" aria-selected="false" aria-controls="resource-panel" data-id="student-stories"><span>06</span>Student Stories</button></div></nav><section id="resource-panel" role="tabpanel"></section><footer><p>Start with one resource. Save what helps. Come back when you need the next step.</p><a href="#financial-aid" id="back-link">Back to the first tab ↑</a></footer></main><script>const categories=[{"id":"financial-aid","number":"01","eyebrow":"Paying for college","title":"Financial Aid & Money","short":"Financial Aid","intro":"Understand aid, meet deadlines, compare offers, and make a realistic plan for college costs.","color":"blue","resources":[{"title":"How Financial Aid Works","description":"Understand grants, scholarships, work-study, and loans before accepting an aid offer.","source":"Federal Student Aid","type":"Official guide","href":"https://studentaid.gov/understand-aid/how-aid-works","time":"6 min"},{"title":"Complete the FAFSA","description":"Start or continue the official federal student-aid application and check current deadlines.","source":"Federal Student Aid","type":"Official application","href":"https://studentaid.gov/h/apply-for-aid/fafsa","time":"Start here"},{"title":"Compare Aid Offers","description":"Compare net price, grants, work-study, and borrowing—not just the largest headline award.","source":"Consumer Financial Protection Bureau","type":"Comparison tool","href":"https://www.consumerfinance.gov/paying-for-college/compare-financial-aid-and-college-cost/","time":"Free tool"},{"title":"Search for Scholarships","description":"Learn where to find scholarships and how to avoid scholarship scams and unnecessary fees.","source":"Federal Student Aid","type":"Official guide","href":"https://studentaid.gov/understand-aid/types/scholarships","time":"5 min"},{"title":"Understand Student Loans","description":"Review federal loan types, interest, repayment responsibilities, and how much to borrow.","source":"Federal Student Aid","type":"Official guide","href":"https://studentaid.gov/understand-aid/types/loans","time":"8 min"},{"title":"Build a College Budget","description":"Plan for tuition, housing, food, books, transportation, and expenses that are easy to overlook.","source":"Consumer Financial Protection Bureau","type":"Money guide","href":"https://www.consumerfinance.gov/consumer-tools/student-loans/manage-your-college-money/","time":"7 min"}]},{"id":"academic-success","number":"02","eyebrow":"Doing well in class","title":"Academic Success","short":"Academics","intro":"Use proven study strategies, plan your time, improve your writing, and know when to ask for help.","color":"green","resources":[{"title":"Use the Study Cycle","description":"Turn previewing, class attendance, review, focused study, and self-checking into a repeatable routine.","source":"UNC Learning Center","type":"University guide","href":"https://learningcenter.unc.edu/tips-and-tools/the-study-cycle/","time":"6 min"},{"title":"Plan Your Semester","description":"Download practical worksheets for weekly planning, goal setting, time management, and reflection.","source":"UNC Learning Center","type":"Free tools","href":"https://learningcenter.unc.edu/tips-and-tools/coaching-tools/","time":"Worksheets"},{"title":"Prepare for Tests","description":"Create a test-day plan that covers sleep, materials, pacing, anxiety, and how to approach questions.","source":"UNC Learning Center","type":"University guide","href":"https://learningcenter.unc.edu/tips-and-tools/test-day-game-plan/","time":"5 min"},{"title":"Get Writing Help","description":"Find guidance for brainstorming, drafting, citations, grammar, research, and avoiding plagiarism.","source":"Purdue OWL","type":"Writing hub","href":"https://owl.purdue.edu/","time":"Reference"},{"title":"Learn to Use Office Hours","description":"See how to prepare questions, introduce yourself, and build a useful relationship with a professor.","source":"Notre Dame Learning","type":"University guide","href":"https://learning.nd.edu/news/uplifting-first-generation-undergraduates-practical-strategies-in-small-classes-and-large-lectures/","time":"5 min"},{"title":"Find Free Tutoring","description":"Search your school for tutoring, supplemental instruction, writing support, and peer-led study groups.","source":"Your college","type":"Campus-specific","href":"https://www.google.com/search?q=site%3A.edu+college+tutoring+academic+support+center","time":"Quick search"}]},{"id":"campus-life","number":"03","eyebrow":"Finding your place","title":"Campus Life & Well-Being","short":"Campus Life","intro":"Build community, care for your health, and quickly find support when college feels overwhelming.","color":"orange","resources":[{"title":"Find Campus Support","description":"Locate counseling, health services, emergency aid, food assistance, disability services, and tutoring.","source":"Your college","type":"Campus-specific","href":"https://www.google.com/search?q=site%3A.edu+student+support+services+counseling+emergency+aid","time":"Quick search"},{"title":"Explore Student Organizations","description":"Find clubs, cultural groups, service organizations, recreation, and events at your school.","source":"Your college","type":"Campus-specific","href":"https://www.google.com/search?q=site%3A.edu+student+organizations+clubs","time":"Quick search"},{"title":"Mental Health Basics","description":"Recognize common concerns, learn how to support a friend, and understand when to seek help.","source":"Active Minds","type":"Well-being guide","href":"https://www.activeminds.org/about-mental-health/","time":"5 min"},{"title":"Find Immediate Support","description":"Call, text, or chat with trained crisis counselors if you or someone else needs urgent emotional support.","source":"988 Lifeline","type":"24/7 support","href":"https://988lifeline.org/","time":"Immediate"},{"title":"Access Basic-Needs Help","description":"Find local food, housing, health, transportation, and financial-assistance programs by ZIP code.","source":"Findhelp","type":"Search tool","href":"https://www.findhelp.org/","time":"Free tool"},{"title":"Understand Accessibility","description":"Learn about accommodations and how disability-access offices can support equal access in college.","source":"U.S. Department of Education","type":"Official guide","href":"https://www2.ed.gov/about/offices/list/ocr/transition.html","time":"Reference"}]},{"id":"first-generation","number":"04","eyebrow":"Navigating college","title":"First-Generation Students","short":"First-Gen","intro":"Decode the hidden curriculum, find community, and use support built for students navigating college first.","color":"teal","resources":[{"title":"First-Gen Resource Hub","description":"Explore guides, research, programs, and events created for first-generation college students.","source":"FirstGen Forward","type":"National resource","href":"https://firstgen.naspa.org/","time":"Resource hub"},{"title":"Understand the Hidden Curriculum","description":"Learn the unwritten academic and social expectations that can make college confusing at first.","source":"Notre Dame Learning","type":"University guide","href":"https://learning.nd.edu/news/uplifting-first-generation-undergraduates-practical-strategies-in-small-classes-and-large-lectures/","time":"6 min"},{"title":"Find TRIO Student Support","description":"Learn about federally funded programs offering tutoring, advising, mentoring, and financial guidance.","source":"U.S. Department of Education","type":"Federal program","href":"https://www.ed.gov/grants-and-programs/grants-higher-education/trio/student-support-services-program","time":"Program finder"},{"title":"Find a Campus First-Gen Program","description":"Search your school for a first-gen center, peer mentor, student group, or special advising program.","source":"Your college","type":"Campus-specific","href":"https://www.google.com/search?q=site%3A.edu+first-generation+student+program","time":"Quick search"},{"title":"Learn College Vocabulary","description":"Look up unfamiliar financial-aid and enrollment terms so campus conversations make more sense.","source":"Federal Student Aid","type":"Official glossary","href":"https://studentaid.gov/help-center/answers/topic/glossary/articles","time":"Reference"},{"title":"Connect With First-Gen Community","description":"Find national First-Generation College Celebration events and ideas for connecting on campus.","source":"FirstGen Forward","type":"Community resource","href":"https://firstgen.naspa.org/engagement/first-generation-college-celebration","time":"Explore"}]},{"id":"career-preparation","number":"05","eyebrow":"Preparing for what comes next","title":"Career Preparation","short":"Careers","intro":"Explore careers, build application materials, find experience, and develop the skills employers value.","color":"purple","resources":[{"title":"Explore Careers","description":"Compare occupations by tasks, education, salary, outlook, and skills to find paths worth exploring.","source":"My Next Move","type":"Career explorer","href":"https://www.mynextmove.org/","time":"Free tool"},{"title":"Build Your Résumé","description":"Choose a format and describe projects, volunteering, clubs, coursework, and work experience clearly.","source":"CareerOneStop","type":"Government partner","href":"https://www.careeronestop.org/JobSearch/Resumes/resumes.aspx","time":"10 min"},{"title":"Use Résumé Examples","description":"Review sections, action verbs, formatting guidance, and sample résumés for different situations.","source":"Purdue OWL","type":"University resource","href":"https://owl.purdue.edu/owl/job_search_writing/resumes_and_vitas/index.html","time":"Examples"},{"title":"Find an Internship","description":"Learn where internships appear, how to evaluate them, and how an internship can build career experience.","source":"CareerOneStop","type":"Career guide","href":"https://www.careeronestop.org/FindTraining/Types/internships.aspx","time":"Start here"},{"title":"Practice Interviewing","description":"Prepare stories and answers, research employers, and learn what to do before and after an interview.","source":"CareerOneStop","type":"Career guide","href":"https://www.careeronestop.org/JobSearch/Interview/interview-and-negotiate.aspx","time":"8 min"},{"title":"Know Career-Ready Skills","description":"Review the communication, teamwork, technology, leadership, and self-development skills employers value.","source":"NACE","type":"Career framework","href":"https://www.naceweb.org/career-readiness/competencies/career-readiness-defined/","time":"6 min"}]},{"id":"student-stories","number":"06","eyebrow":"Advice from people who lived it","title":"College Student Stories","short":"Student Stories","intro":"Read honest anecdotes from students about belonging, asking for help, choosing a path, and adjusting to college.","color":"rose","resources":[{"title":"First-Gen Stories at Michigan","description":"Read dozens of short student and alumni accounts about belonging, mentors, asking questions, and taking risks.","source":"University of Michigan","type":"Student anecdotes","href":"https://firstgen.umich.edu/our-stories/","time":"Story collection"},{"title":"#UMNFirst Stories","description":"Hear first-generation students describe their journeys, challenges, accomplishments, and campus communities.","source":"University of Minnesota","type":"Student anecdotes","href":"https://firstgen.umn.edu/resources/umnfirst-stories","time":"Story collection"},{"title":"First-Gen Voices","description":"Explore personal perspectives and student-focused stories from a national first-generation community.","source":"FirstGen Forward","type":"Student perspectives","href":"https://firstgen.naspa.org/why-first-gen/students","time":"Story hub"},{"title":"College Stories and Advice","description":"Browse student-created reflections about applying, paying for college, adjusting, and succeeding.","source":"I’m First!","type":"Student community","href":"https://imfirst.org/","time":"Story hub"},{"title":"Student Mental-Health Stories","description":"Read personal stories that make common college mental-health experiences feel less isolating.","source":"Active Minds","type":"Personal stories","href":"https://www.activeminds.org/blog/","time":"Article collection"},{"title":"Share Your Own Story","description":"Use Michigan’s prompts as inspiration to record a short college anecdote and advice for the next student.","source":"University of Michigan","type":"Reflection prompt","href":"https://firstgen.umich.edu/our-stories/","time":"Contribute"}]}];const panel=document.querySelector("#resource-panel");const buttons=[...document.querySelectorAll("[role=tab]")];function show(id){const c=categories.find(x=>x.id===id)||categories[0];panel.className="category category-"+c.color;panel.innerHTML=`<div class="category-heading"><span class="category-number">${c.number}</span><div><p>${c.eyebrow}</p><h2>${c.title}</h2><span>${c.intro}</span><em>${c.resources.length} resources</em></div></div><div class="card-grid">${c.resources.map(r=>`<a class="resource-card" href="${r.href}" target="_blank" rel="noreferrer"><div class="card-topline"><span>${r.type}</span><span>${r.time}</span></div><h3>${r.title}</h3><p>${r.description}</p><div class="card-footer"><span>${r.source}</span><b aria-hidden="true">↗</b></div></a>`).join("")}</div>`;buttons.forEach(b=>b.setAttribute("aria-selected",String(b.dataset.id===c.id)));history.replaceState(null,"","#"+c.id)}buttons.forEach(b=>b.addEventListener("click",()=>show(b.dataset.id)));document.querySelector("#back-link").addEventListener("click",e=>{e.preventDefault();show("financial-aid");scrollTo({top:0,behavior:"smooth"})});show(location.hash.slice(1));</script></body></html>
